[package]
name = "honeycomb"
version = "0.5.0"
edition = "2021"
description = "Honeycomb decentralized encrypted backup prototype"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
zeroize = "1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
